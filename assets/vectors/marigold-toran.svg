<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="gendaYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="gendaOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA450" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B43403" />
    </radialGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B7C59" />
      <stop offset="100%" stop-color="#2D5A38" />
    </linearGradient>
  </defs>

  <!-- Hanging Twine Rope -->
  <path d="M 0 18 Q 125 45 250 18 Q 375 45 500 18 Q 625 45 750 18 Q 875 45 1000 18" stroke="#8C6D37" stroke-width="2.5" />
  
  <!-- Mango Leaves (Aam Patta) -->
