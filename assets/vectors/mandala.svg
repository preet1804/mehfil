<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#C5A059" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9E782F" stop-opacity="0.1" />
    </radialGradient>
  </defs>
  <g transform="translate(300, 300)" stroke="#D4AF37" fill="none" stroke-width="1.2" opacity="0.85">
    <!-- Concentric Circles -->
    <circle r="280" stroke-width="2" />
    <circle r="270" stroke-dasharray="3 3" />
    <circle r="240" stroke-width="1" />
    <circle r="200" stroke-width="1.5" />
    <circle r="150" stroke-dasharray="4 4" />
    <circle r="100" stroke-width="1.5" />
    <circle r="60" stroke-width="1" />
    <circle r="25" fill="#D4AF37" opacity="0.3" />

    <!-- 16 Outer Floral Petals -->
    <g id="petalGroup">
      <path d="M 0 -200 C 35 -240 35 -270 0 -280 C -35 -270 -35 -240 0 -200 Z" fill="#D4AF37" fill-opacity="0.08" />
      <path d="M 0 -150 C 25 -175 25 -195 0 -200 C -25 -195 -25 -175 0 -150 Z" />
      <path d="M 0 -100 C 20 -120 20 -140 0 -150 C -20 -140 -20 -120 0 -100 Z" fill="#D4AF37" fill-opacity="0.15" />
      <path d="M 0 -60 C 14 -75 14 -90 0 -100 C -14 -90 -14 -75 0 -60 Z" />
      <!-- Dots -->
      <circle cx="0" cy="-260" r="3" fill="#D4AF37" />
      <circle cx="0" cy="-180" r="2" fill="#D4AF37" />
    </g>
    <!-- Rotate 16 times -->
    <use href="#petalGroup" transform="rotate(22.5)" />
    <use href="#petalGroup" transform="rotate(45)" />
    <use href="#petalGroup" transform="rotate(67.5)" />
    <use href="#petalGroup" transform="rotate(90)" />
    <use href="#petalGroup" transform="rotate(112.5)" />
    <use href="#petalGroup" transform="rotate(135)" />
    <use href="#petalGroup" transform="rotate(157.5)" />
    <use href="#petalGroup" transform="rotate(180)" />
    <use href="#petalGroup" transform="rotate(202.5)" />
    <use href="#petalGroup" transform="rotate(225)" />
    <use href="#petalGroup" transform="rotate(247.5)" />
    <use href="#petalGroup" transform="rotate(270)" />
    <use href="#petalGroup" transform="rotate(292.5)" />
    <use href="#petalGroup" transform="rotate(315)" />
    <use href="#petalGroup" transform="rotate(337.5)" />
  </g>
</svg>