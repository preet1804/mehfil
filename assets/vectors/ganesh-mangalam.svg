<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="invGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <g stroke="url(#invGold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Artistic Minimal Ganesh Monogram -->
    <!-- Crown / Trishul element -->
    <path d="M 70 20 L 70 35" stroke-width="2" />
    <path d="M 64 24 Q 70 30 76 24" />
    <circle cx="70" cy="16" r="2.5" fill="url(#invGold)" />
    
    <!-- Ears and Forehead -->
    <path d="M 50 38 Q 42 45 44 58 Q 48 70 58 72" />
    <path d="M 90 38 Q 98 45 96 58 Q 92 70 82 72" />
    
    <!-- Trunk / Vakratunda curve -->
    <path d="M 68 40 Q 75 48 74 65 Q 73 85 82 92 Q 90 98 94 92 Q 97 86 92 84 Q 86 82 86 88" stroke-width="2.2" />
    
    <!-- Tika / Bindi -->
    <line x1="66" y1="46" x2="74" y2="46" stroke-width="1.8" />
    <circle cx="70" cy="51" r="1.5" fill="url(#invGold)" />

    <!-- Modak / Auspicious blessing plate -->
    <path d="M 52 75 C 50 82 54 88 62 88" />
    <circle cx="56" cy="78" r="2" fill="url(#invGold)" />
    
    <!-- Circular Halo -->
    <circle cx="70" cy="65" r="54" stroke-dasharray="2 3" stroke-width="0.8" opacity="0.6" />
  </g>
</svg>