      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#781D32" />
      <stop offset="100%" stop-color="#4A101D" />
    </linearGradient>
  </defs>
  
  <!-- Royal Emblem / Arch & Diya Kalash Motif -->
  <g transform="translate(10, 8)">
    <!-- Outer Arch -->
    <path d="M 50 12 C 30 12 14 28 14 52 C 14 84 50 98 50 98 C 50 98 86 84 86 52 C 86 28 70 12 50 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <path d="M 50 18 C 34 18 20 32 20 52 C 20 78 50 92 50 92 C 50 92 80 78 80 52 C 80 32 66 18 50 18 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 2" />
    
    <!-- Central Royal Lotus / Kalash Motif -->
    <path d="M 50 32 C 45 42 35 48 35 60 C 35 68 41 74 50 74 C 59 74 65 68 65 60 C 65 48 55 42 50 32 Z" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
    <path d="M 50 36 C 47 46 41 52 41 60 C 41 65 45 69 50 69 C 55 69 59 65 59 60 C 59 52 53 46 50 36 Z" fill="url(#goldGrad)" opacity="0.3" />
    <!-- Auspicious Diya Flame -->
    <path d="M 50 24 C 47 28 47 32 50 36 C 53 32 53 28 50 24 Z" fill="url(#goldGrad)" />
    <!-- Ornamental dots -->
    <circle cx="50" cy="8" r="2.5" fill="url(#goldGrad)" />
    <circle cx="50" cy="82" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(115, 0)">
    <text x="0" y="62" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#burgundyGrad)">MEHFIL</text>
    <line x1="2" y1="74" x2="380" y2="74" stroke="url(#goldGrad)" stroke-width="1.2" />
    <polygon points="190,72 195,74 190,76 185,74" fill="url(#goldGrad)" />
    <text x="2" y="94" font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="5" fill="#8C6D37">BESPOKE INDIAN WEDDINGS &amp; DIGITAL RSVP</text>
